[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scangap"
version = "0.1.0"
description = "Vendor-neutral coverage & scope QA for reality-capture crews"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "reportlab>=4.0",
  "pypdf>=4.0",
  "laspy>=2.5",
  "lazrs>=0.6",
  "pye57>=0.4.5",
  "anthropic>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
scangap = "scangap.cli:main"

[tool.setuptools.packages.find]
include = ["scangap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
